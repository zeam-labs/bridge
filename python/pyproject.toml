[project]
name = "zeambridge"
version = "2.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "ZEAM Labs, LLC", email = "info@zeamlabs.com"}]
description = "ZEAM :: Bridge for your own server: a paywall (x402 and MPP; you keep 90.01%), a key gate, or both, for your MCP and HTTP tools. Runs in your process with your keys."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["x402", "mpp", "mcp", "agents", "paywall", "gate", "batch-settlement", "usdc", "base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "coincurve>=20,<22",
    "pycryptodome>=3.19,<4",
]

[project.urls]
Homepage = "https://zeambridge.com"
Source = "https://github.com/zeam-labs/bridge"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["zeam_pass"]

[tool.setuptools.packages.find]
include = ["zeam_bridge*", "zeam_pass"]
